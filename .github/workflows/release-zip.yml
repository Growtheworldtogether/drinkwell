# Builds drinkwell-release.zip (the file you upload to cPanel) on GitHub's servers.
# Run it from the Actions tab, "Build release zip", "Run workflow". The zip appears on the Releases page.
name: Build release zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, mbstring, gd, intl
          tools: composer

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: PHP packages for the live site (no testing tools)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Build styles and scripts
        shell: bash
        run: |
          set -o pipefail
          node -v
          build() { npm run build 2>&1 | tee build.log; }
          if ! (npm ci --no-audit --no-fund 2>&1 | tee install.log && build); then
            echo "First try failed; reinstalling packages for Linux and trying again."
            rm -rf node_modules
            npm install --no-audit --no-fund 2>&1 | tee install.log
            if ! build; then
              tail -n 25 install.log build.log | sed 's/^/::error::/'
              exit 1
            fi
          fi

      - name: Pack the zip
        run: |
          php scripts/make-release.php
          php scripts/make-release.php --public-html

      - name: Publish on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="release-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" drinkwell-release.zip drinkwell-release-public_html.zip \
            --title "Upload zip $(date -u '+%Y-%m-%d %H:%M') UTC" \
            --notes "drinkwell-release-public_html.zip: for a domain that must use public_html (extract in your home folder). drinkwell-release.zip: for a domain whose document root you can set to drinkwell/public. See docs/DEPLOY-CPANEL.md. Built from ${GITHUB_SHA::7}."
